name: CI & Deploy

# Ablauf:
#  - Bei JEDEM Push/PR: vollständige Testsuite (Gate).
#  - Nur bei Push auf main UND grünen Tests: automatischer Deploy per SSH.
# Alle server-/geheimnisspezifischen Werte kommen aus GitHub Secrets,
# nichts Sensibles liegt im Repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nie zwei Deploys gleichzeitig auf denselben Server.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # 1) Test-Gate: baut die App wie in Produktion und lässt die volle Suite laufen
  # ---------------------------------------------------------------------
  test:
    name: Tests & Build-Verifikation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3 einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          coverage: none

      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: .env vorbereiten
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Node einrichten & Assets bauen (Build-Verifikation)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Migrationen prüfen (frische DB, SQLite)
        run: php artisan migrate:fresh --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Volle Testsuite
        run: php artisan test

  # ---------------------------------------------------------------------
  # 1a) MySQL-Integrationslauf (ARCH-2). Produktion laeuft auf MySQL - eine
  #     Pipeline, die ausschliesslich SQLite testet, prueft eine andere
  #     Datenbank als die, auf der der Betrieb stattfindet. Genau dort
  #     liegen die Unterschiede, die spaet auffallen: strikte Modi,
  #     Spaltenlaengen, Index-Grenzen (MySQL: 3072 Byte je Index),
  #     Sortier-/Vergleichsregeln und das Verhalten von ONLY_FULL_GROUP_BY.
  #     Der schnelle SQLite-Lauf oben bleibt das Haupt-Gate; dieser Job
  #     stellt sicher, dass die Produktionsdatenbank ebenfalls abgedeckt ist.
  # ---------------------------------------------------------------------
  test-mysql:
    name: Tests gegen MySQL (Produktionsdatenbank)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3 einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, mysqli, bcmath, intl, gd, zip
          coverage: none

      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: .env vorbereiten
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Node einrichten & Assets bauen
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      # Erst die Migrationen: laufen sie auf MySQL nicht durch, ist die
      # Ursache eine andere als ein fehlgeschlagener Test - und dann soll
      # im Log auch genau das stehen.
      - name: Migrationen gegen MySQL prüfen
        run: php artisan migrate:fresh --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: portal_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Volle Testsuite gegen MySQL
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: portal_test
          DB_USERNAME: root
          DB_PASSWORD: root

  # ---------------------------------------------------------------------
  # 1d) Code-Qualitaet (ARCH-4): einheitliche Formatierung und statische
  #     Analyse. Eigener Job, damit im Actions-Ueberblick sofort sichtbar
  #     ist, WORAN es lag - ein Schritt innerhalb von "Tests" laesst nur
  #     "Tests rot" stehen, und dann sucht man an der falschen Stelle.
  # ---------------------------------------------------------------------
  qualitaet:
    name: Codeformat und statische Analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3 einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          coverage: none

      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist --no-progress

      # Formatierung: --test aendert nichts, es meldet nur. Der Job wird rot,
      # sobald eine Datei nicht der Regel in pint.json entspricht.
      # Lokal reparieren: composer lint:fix
      - name: Pint (Formatierung prüfen)
        run: composer lint

      - name: .env vorbereiten (PHPStan liest die Konfiguration)
        run: |
          cp .env.example .env
          php artisan key:generate

      # PHPStan laeuft auf Stufe 5 gegen phpstan-baseline.neon: der
      # Altbestand (922 Meldungen) ist eingefroren, JEDE NEUE Meldung macht
      # den Job rot. Die Baseline ist ein Uebergang - wer eine Datei
      # anfasst, streicht ihre Eintraege am besten gleich mit.
      # Lokal: composer stan
      - name: PHPStan / Larastan (Stufe 5, gegen Baseline)
        run: composer stan

  # ---------------------------------------------------------------------
  # 1b) Sicherheits-Gate: bekannte Schwachstellen in Abhaengigkeiten
  #     (Audit SEC-3). Eigener Job, damit im Actions-Ueberblick sofort
  #     sichtbar ist, WORAN es lag - ein Schritt innerhalb von "Tests"
  #     laesst nur "Tests rot" stehen, und dann sucht man an der falschen
  #     Stelle.
  # ---------------------------------------------------------------------
  audit:
    name: Sicherheitspruefung der Abhaengigkeiten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3 einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          coverage: none

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist --no-progress

      # composer audit endet mit Exitcode != 0, sobald ein Hinweis
      # vorliegt - der Job wird damit rot und der Deploy laeuft nicht.
      # Bewusst OHNE --ignore-severity: eine "nur mittlere" Luecke ist
      # eine Luecke, und die Ausnahme waere schnell die Regel.
      # Muss ein Hinweis einmal wirklich stehen bleiben (Abhaengigkeit
      # laesst sich nicht aufloesen), wird er in composer.json unter
      # extra.audit.ignore MIT BEGRUENDUNG eingetragen - dann steht die
      # Entscheidung im Repository und nicht in diesem Workflow.
      - name: composer audit (Produktions- und Dev-Abhängigkeiten)
        run: composer audit

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # npm audit: nur Produktionsabhaengigkeiten und erst ab "high".
      # Der JS-Baum besteht hier fast nur aus Build-Werkzeug (vite,
      # tailwind), das nie im Browser eines Kunden landet - jede
      # Schwachstelle darin waere ein Hinweis ohne Angriffsflaeche und
      # wuerde das Gate unglaubwuerdig machen.
      - name: npm audit (Produktionsabhängigkeiten)
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------
  # 1c) Cloudflare-Ranges: meldet, wenn die hinterlegte Trusted-Proxy-Liste
  #     von der veroeffentlichten abweicht (Audit SEC-2). Blockiert den
  #     Deploy NICHT - eine Abweichung ist ein Pflegehinweis, kein Defekt,
  #     und ein nicht erreichbarer Cloudflare-Endpunkt darf kein Deploy
  #     verhindern.
  # ---------------------------------------------------------------------
  proxy-liste:
    name: Cloudflare-Ranges abgleichen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      # Der Abgleich ist ein PFLEGEHINWEIS, kein Gate: eine Abweichung
      # muss ein Mensch bewerten (Cloudflare hat Ranges geaendert), und
      # ein nicht erreichbarer Endpunkt darf schon gar nichts bedeuten.
      # Das Ergebnis steht deshalb in der Zusammenfassung des Laufs,
      # statt als roter Haken - ein Haken, der regelmaessig ohne Defekt
      # rot ist, wird nach der zweiten Woche ignoriert.
      - name: Cloudflare-Ranges vergleichen (nur Hinweis)
        run: |
          set +e
          ausgabe=$(bash scripts/pruefe-cloudflare-ips.sh 2>&1)
          code=$?
          echo "$ausgabe"
          {
            case $code in
              0) echo "### ✅ Cloudflare-Ranges sind aktuell" ;;
              2) echo "### ℹ️ Cloudflare-Liste nicht abrufbar - nichts zu melden" ;;
              *) echo "### ⚠️ Cloudflare-Ranges weichen ab - bitte config/trustedproxy.php pruefen" ;;
            esac
            echo
            echo '```'
            echo "$ausgabe"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # 2) Deploy: läuft NUR nach grünem Test-Gate und NUR bei Push auf main
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy auf Produktionsserver
    # Der Deploy haengt an: gruenen Tests (SQLite), sauberem Codeformat und
    # keiner neuen PHPStan-Meldung (ARCH-4), sowie keinen bekannten
    # Schwachstellen in den Abhaengigkeiten (Audit SEC-3).
    #
    # test-mysql laeuft mit, ist hier aber BEWUSST noch nicht eingetragen:
    # die Suite ist bisher nie gegen MySQL gelaufen, und ein Gate, dessen
    # erster Lauf ungeprueft ist, wuerde im Zweifel einen dringenden Fix
    # blockieren. Der Job meldet trotzdem ehrlich rot oder gruen.
    # SOBALD er einmal gruen war, gehoert er in diese Liste - dann ist die
    # Produktionsdatenbank ein echtes Gate:
    #   needs: [test, test-mysql, qualitaet, audit]
    needs: [test, qualitaet, audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Per SSH deployen
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all --prune
            git reset --hard origin/main
            bash scripts/deploy.sh
